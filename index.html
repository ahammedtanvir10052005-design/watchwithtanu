<!DOCTYPE html>
<html>
<head>
  <title>WatchWithTanu Sports</title>

  <style>
    body{
      background:black;
      color:white;
      text-align:center;
      font-family:Arial;
    }

    h1{
      color:red;
      margin-top:20px;
    }

    iframe{
      width:90%;
      height:500px;
      margin-top:20px;
      border-radius:10px;
      border:none;
    }

    button{
      padding:12px 20px;
      margin:10px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>WatchWithTanu Sports Live</h1>

<button onclick="playChannel('https://www.youtube.com/embed/jfKfPfyJRdk')">
Sports Channel 1
</button>

<button onclick="playChannel('https://www.youtube.com/embed/5qap5aO4i9A')">
Sports Channel 2
</button>

<button onclick="playChannel('https://www.youtube.com/embed/x5MkVTvOViQ')">
Sports Channel 3
</button>

<br>

<iframe id="player"
src="https://www.youtube.com/embed/jfKfPfyJRdk"
allowfullscreen>
</iframe>

<script>
function playChannel(link){
  document.getElementById("player").src = link;
}
</script>

</body>
</html>
